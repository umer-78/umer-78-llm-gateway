services:
  redis:
    image: redis:7-alpine
  gateway:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-change-me}
    ports: ["8000:8000"]
    depends_on: [redis]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
  traffic:  # steady demo traffic: docker compose --profile demo up
    build: .
    command: ["python", "-m", "bench.traffic", "--url", "http://gateway:8000", "--rps", "6"]
    depends_on: [gateway]
    profiles: [demo]
