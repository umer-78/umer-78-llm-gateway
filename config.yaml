# Three simulated providers so the gateway runs with no API keys. To route to
# real models, change a provider to kind: openai_compat (examples at the bottom).
providers:
  - name: alpha
    kind: mock
    model: frontier-large
    price_in: 3.00        # USD per million input tokens (example pricing, not a quote)
    price_out: 15.00
    median_latency_s: 0.8
    latency_sigma: 0.4
    error_rate: 0.005
    latency_budget_s: 3.0   # p95 above this opens the breaker
  - name: beta
    kind: mock
    model: frontier-alt
    price_in: 2.50
    price_out: 10.00
    median_latency_s: 1.0
    latency_sigma: 0.4
    error_rate: 0.005
    latency_budget_s: 3.5
  - name: gamma
    kind: mock
    model: small-self-hosted
    price_in: 0.20
    price_out: 0.60
    median_latency_s: 1.4
    latency_sigma: 0.35
    error_rate: 0.005
    latency_budget_s: 5.0   # the small model is slower when healthy; one shared budget kept tripping it

# Each class fails over differently: chat is latency-sensitive and hedged,
# classification prefers the cheap model, batch work can wait for recovery.
classes:
  interactive:
    preference: [alpha, beta, gamma]
    timeout_s: 10
    hedge_after_s: 2.5
  classify:
    preference: [gamma, alpha, beta]
    timeout_s: 5
  batch:
    preference: [gamma, beta, alpha]
    timeout_s: 30
    deferrable: true

default_class: interactive
window_s: 30

breaker:
  error_rate: 0.5
  consecutive_failures: 5
  p95_budget_s: 3.0
  min_requests: 10
  cooldown_s: 15
  probe_fraction: 0.1
  probes_to_close: 3

queue:
  max_attempts: 8
  base_delay_s: 2
  max_delay_s: 60

