[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Self-healing LLM gateway: circuit breakers, failover, hedging, a deferrable queue and per-tenant cost attribution"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["gateway"]
